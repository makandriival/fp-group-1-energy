<div class="home-page">
  <div data-hero-slot></div>

  <aside class="home-page__daily" aria-label="Daily motivation">
    <div class="home-page__quote" data-quote-slot></div>

    <picture class="home-page__photo">
      <source
        media="(min-width: 1200px)"
        type="image/webp"
        data-daily-source="desktop"
      />
      <source
        media="(min-width: 768px)"
        type="image/webp"
        data-daily-source="tablet"
      />
      <source type="image/webp" data-daily-source="mobile" />
      <img
        class="home-page__photo-image"
        alt="Two women with water bottles talking after a workout"
        width="335"
        height="242"
        loading="lazy"
        decoding="async"
        data-daily-image
      />
    </picture>

    <div data-daily-norm-slot></div>
  </aside>
</div>
